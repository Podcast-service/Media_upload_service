[package]
name = "media_api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart", "macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenTelemetry: export traces, metrics and logs to the OTEL collector (OTLP/gRPC).
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "metrics", "logs"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.27"
tracing-opentelemetry = "0.28"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1.0"
aws-config = "1.8.14"
aws-credential-types = "1.2.13"
aws-sdk-s3 = "1.124.0"
utoipa = { version = "4", features = ["axum_extras", "uuid", "chrono"] }
tempfile = "3"
rdkafka = { version = "0.39.0", features = ["cmake-build"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "9"
